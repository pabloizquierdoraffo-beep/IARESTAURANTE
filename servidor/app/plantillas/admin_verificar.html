{% extends "base.html" %}
{% block titulo %}Verificación{% endblock %}
{% block cuerpo %}
<main class="pagina">
  <h1>Doble verificación</h1>
  <p class="suave">Escribe el código de 6 números de tu app de verificación.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/verificar" class="tarjeta">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="codigo" class="etiqueta">Código</label>
    <input id="codigo" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
    <button class="btn principal" type="submit">Entrar</button>
  </form>
</main>
{% endblock %}
