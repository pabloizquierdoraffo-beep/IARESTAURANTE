{% extends "base.html" %}
{% block titulo %}Administración{% endblock %}
{% block cuerpo %}
<main class="pagina">
  <h1>Administración</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/entrar" class="tarjeta">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email" class="etiqueta">Correo</label>
    <input id="email" name="email" type="text" inputmode="email" autocomplete="username" required>
    <label for="contrasena" class="etiqueta">Contraseña</label>
    <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required style="width:100%;min-height:56px;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px">
    <button class="btn principal" type="submit">Continuar</button>
  </form>
</main>
{% endblock %}
